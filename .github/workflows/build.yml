name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release name (upstream tag such as v13_0, or a date such as 2026.11.04)"
        required: true
        type: string
      ref:
        description: "Upstream commit, tag, or branch to build. Defaults to tag."
        required: false
        type: string
        default: ""
      version_tag:
        description: "VERSION_TAG baked into iverilog -V, for example 2026.11.04-dirty. Empty keeps git-describe."
        required: false
        type: string
        default: ""
      latest:
        description: "Mark this release as the repository latest"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout upstream ref
        uses: actions/checkout@v4
        with:
          repository: steveicarus/iverilog
          ref: ${{ inputs.ref || inputs.tag }}
          fetch-depth: 1
          fetch-tags: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf gperf bison flex

      - name: Configure and build
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          make_stamp=()
          if [ -n "$VERSION_TAG" ]; then
            case "$VERSION_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "version_tag may contain only letters, digits, dot, underscore, and hyphen" >&2
                exit 1
                ;;
            esac
            printf '#define VERSION_TAG "%s"\n' "$VERSION_TAG" > release_tag.h
            make_stamp+=(GIT=none)
          fi
          sh autoconf.sh
          ./configure --prefix="$PWD/dist"
          make -j"$(nproc)" "${make_stamp[@]}"
          make install "${make_stamp[@]}"

      - name: Check version
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          ./dist/bin/iverilog -V
          ./dist/bin/vvp -V
          if [ -n "$VERSION_TAG" ]; then
            ./dist/bin/iverilog -V | grep -F "$VERSION_TAG"
          fi
          cat > /tmp/t.v << 'EOF'
          module t;
            initial begin
              $display("icarus ok");
              $finish;
            end
          endmodule
          EOF
          ./dist/bin/iverilog -o /tmp/t.vvp /tmp/t.v
          ./dist/bin/vvp /tmp/t.vvp

      - name: Package
        run: |
          tar -C dist -czf icarus-ubuntu-24.04.tar.gz .
          tar -tzf icarus-ubuntu-24.04.tar.gz | head

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          make_latest: ${{ inputs.latest }}
          files: icarus-ubuntu-24.04.tar.gz
          fail_on_unmatched_files: true
          body: |
            Prebuilt Icarus Verilog ${{ inputs.tag }} for ubuntu-24.04.
            Source: https://github.com/steveicarus/iverilog/tree/${{ inputs.ref || inputs.tag }}
            VERSION_TAG: ${{ inputs.version_tag || 'git-describe' }}
            Archive layout: prefix install (`bin/`, `lib/ivl/`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
