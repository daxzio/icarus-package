name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release name (upstream tag such as v13_0, or a date such as 2026.11.04)"
        required: true
        type: string
      ref:
        description: "Upstream commit, tag, or branch to build. Defaults to tag."
        required: false
        type: string
        default: ""
      version_tag:
        description: "VERSION_TAG baked into iverilog -V, for example 2026.11.04-dirty. Empty keeps git-describe."
        required: false
        type: string
        default: ""
      latest:
        description: "Mark this release as the repository latest"
        required: false
        type: boolean
        default: false
      targets:
        description: "Ubuntu images to build"
        required: false
        type: choice
        default: all
        options:
          - all
          - 24.04
          - 26.04

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          case "${{ inputs.targets }}" in
            all)
              matrix='{"include":[{"runs-on":"ubuntu-24.04","ubuntu":"24.04"},{"runs-on":"ubuntu-26.04","ubuntu":"26.04"}]}'
              ;;
            24.04)
              matrix='{"include":[{"runs-on":"ubuntu-24.04","ubuntu":"24.04"}]}'
              ;;
            26.04)
              matrix='{"include":[{"runs-on":"ubuntu-26.04","ubuntu":"26.04"}]}'
              ;;
            *)
              echo "unknown targets=${{ inputs.targets }}" >&2
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - name: Checkout upstream ref
        uses: actions/checkout@v4
        with:
          repository: steveicarus/iverilog
          ref: ${{ inputs.ref || inputs.tag }}
          fetch-depth: 1
          fetch-tags: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf gperf bison flex

      - name: Configure and build
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          make_stamp=()
          if [ -n "$VERSION_TAG" ]; then
            case "$VERSION_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "version_tag may contain only letters, digits, dot, underscore, and hyphen" >&2
                exit 1
                ;;
            esac
            printf '#define VERSION_TAG "%s"\n' "$VERSION_TAG" > release_tag.h
            make_stamp+=(GIT=none)
          fi
          sh autoconf.sh
          ./configure --prefix="$PWD/dist"
          make -j"$(nproc)" "${make_stamp[@]}"
          make install "${make_stamp[@]}"

      - name: Check version
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          ./dist/bin/iverilog -V
          ./dist/bin/vvp -V
          if [ -n "$VERSION_TAG" ]; then
            ./dist/bin/iverilog -V | grep -F "$VERSION_TAG"
          fi
          cat > /tmp/t.v << 'EOF'
          module t;
            initial begin
              $display("icarus ok");
              $finish;
            end
          endmodule
          EOF
          ./dist/bin/iverilog -o /tmp/t.vvp /tmp/t.v
          ./dist/bin/vvp /tmp/t.vvp

      - name: Package
        run: |
          set -euo pipefail
          asset="icarus-ubuntu-${{ matrix.ubuntu }}.tar.gz"
          tar -C dist -czf "$asset" .
          tar -tzf "$asset" >/dev/null

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: icarus-ubuntu-${{ matrix.ubuntu }}.tar.gz
          path: icarus-ubuntu-${{ matrix.ubuntu }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: icarus-ubuntu-*
          merge-multiple: true

      - name: Verify at least one tarball
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(icarus-ubuntu-*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No icarus-ubuntu-*.tar.gz artifacts were produced" >&2
            exit 1
          fi
          ls -la "${files[@]}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          make_latest: ${{ inputs.latest }}
          files: icarus-ubuntu-*.tar.gz
          fail_on_unmatched_files: false
          body: |
            Prebuilt Icarus Verilog ${{ inputs.tag }} for GitHub-hosted Ubuntu runners.

            | Asset | Runner |
            |-------|--------|
            | `icarus-ubuntu-26.04.tar.gz` | `ubuntu-26.04` / `ubuntu-latest` (while latest is 26.04) |
            | `icarus-ubuntu-24.04.tar.gz` | `ubuntu-24.04` |

            Source: https://github.com/steveicarus/iverilog/tree/${{ inputs.ref || inputs.tag }}
            VERSION_TAG: ${{ inputs.version_tag || 'git-describe' }}

            Archive layout: prefix install (`bin/`, `lib/ivl/`).
            [`daxzio/setup-icarus`](https://github.com/daxzio/setup-icarus) picks the asset for the runner automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}